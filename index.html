<!doctype html>
<html lang="{{ meta.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Text comes from src/i18n/en.json (filled in by the i18n-html plugin in vite.config.ts). -->
    <meta name="description" content="{{ meta.description }}" />
    <meta property="og:title" content="{{ meta.title }}" />
    <meta property="og:description" content="{{ meta.description }}" />
    <meta name="theme-color" content="#130918" />
    <link rel="icon" type="image/png" href="./icons/icon-light.png" media="(prefers-color-scheme: light)" data-theme-icon="light" />
    <link rel="icon" type="image/png" href="./icons/icon-dark.png" media="(prefers-color-scheme: dark)" data-theme-icon="dark" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>{{ meta.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
